<!doctype html>
<html lang="fr" manifest="cache.appcache">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>INFO SAMOUD</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;min-height:100vh;background:#070b14;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.page{width:min(900px,92%);text-align:center;padding:50px 25px}.shop{display:inline-block;margin-bottom:22px;padding:9px 22px;border:1px solid #25d9ff;border-radius:30px;color:#25d9ff;font-size:15px;font-weight:800;letter-spacing:4px;box-shadow:0 0 20px rgba(37,217,255,.15)}h1{font-size:clamp(42px,8vw,82px);line-height:1;font-weight:900;letter-spacing:2px}h1 span{color:#25d9ff}.subtitle{margin-top:20px;font-size:clamp(20px,3vw,30px);font-weight:800}.enjoy{margin-top:14px;color:#aab7c7;font-size:17px}.status{margin:38px auto 0;max-width:650px;padding:22px;border:1px solid rgba(37,217,255,.35);border-radius:16px;background:#0c1220;box-shadow:0 0 35px rgba(0,0,0,.3)}#state{font-size:22px;font-weight:900;color:#25d9ff}#det,#cache{margin-top:8px;color:#91a0b2;font-size:14px}.bad{color:#ff6b7a!important}.warn{color:#ffd166!important}.cacheok{color:#67e8a5!important}.footer{margin-top:35px;color:#657386;font-size:13px}
</style>
</head>
<body>
<main class="page">
<div class="shop">INFO SAMOUD</div>
<h1>JAILBREAK <span>PS4</span></h1>
<div class="subtitle">13.02 → 13.52</div>

<div class="status"><div id="state">détection du firmware…</div><div id="det"></div><div id="cache"></div></div>
<div class="footer">INFO SAMOUD 🎮</div>
</main>
    <script>
      function toggleMenu() {
        document.getElementById("navigation").classList.toggle("show");
      }
    </script>
    <script>
      (function () {
        var stateEl = document.getElementById("state"),
          detEl = document.getElementById("det"),
          cacheEl = document.getElementById("cache");
        function setState(t, c) {
          stateEl.textContent = t;
          stateEl.className = c || "";
        }
        function setCache(t, ok) {
          cacheEl.textContent = t;
          cacheEl.className = ok ? "cacheok" : "";
        }
        var params = new URLSearchParams(location.search),
          SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 },
          key = null,
          fwnum = null;
        var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
        if (m) {
          var ms = parseInt(m[2], 16).toString(16);
          if (ms.length < 2) ms = "0" + ms;
          key = m[1] + "." + ms;
          fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
        }
        var supported =
          params.get("force") === "1" ||
          (fwnum !== null && SUPPORTED[fwnum] === 1);
        detEl.innerHTML =
          "firmware <b>" +
          (key || "unknown") +
          "</b>" +
          (supported
            ? " &middot; <b>supported</b>"
            : " &middot; not in this build's kernel table");
        var target = "jb.html" + location.search;
        function go() {
          setState("loading jailbreak...", "warn");
          location.replace(target);
        }
        function waitForTap(msg, action) {
          setState(msg, "warn");
          function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
          }
          window.addEventListener("click", fire);
          window.addEventListener("keydown", fire);
        }
        if (!supported) {
          setState("UNSUPPORTED FIRMWARE", "bad");
          waitForTap(
            "UNSUPPORTED (" +
              (key || "unknown") +
              ") -- press X or tap to run anyway",
            go,
          );
          return;
        }
        var ac = window.applicationCache;
        if (!ac || !document.documentElement.hasAttribute("manifest")) go();
        else if (!navigator.onLine) {
          setCache("offline -- from cache", true);
          go();
        } else if (ac.status === ac.IDLE) {
          setCache("cached", true);
          go();
        } else if (ac.status === ac.UPDATEREADY) {
          try {
            ac.swapCache();
          } catch (e) {}
          setCache("update downloaded", true);
          waitForTap(
            "UPDATE READY -- press X or tap to reload & run",
            function () {
              location.reload();
            },
          );
        } else {
          setCache("checking cache...");
          ac.addEventListener(
            "downloading",
            function () {
              setCache("caching for offline (first run)...");
            },
            false,
          );
          ac.addEventListener(
            "progress",
            function (e) {
              if (e && e.total)
                setCache(
                  "caching " + Math.round((e.loaded / e.total) * 100) + "%",
                );
            },
            false,
          );
          ac.addEventListener(
            "cached",
            function () {
              setCache("cached for offline use", true);
              waitForTap("CACHED (first run) -- press X or tap to run", go);
            },
            false,
          );
          ac.addEventListener(
            "updateready",
            function () {
              try {
                ac.swapCache();
              } catch (e) {}
              setCache("update downloaded", true);
              waitForTap(
                "UPDATE READY -- press X or tap to reload & run",
                function () {
                  location.reload();
                },
              );
            },
            false,
          );
          ac.addEventListener(
            "noupdate",
            function () {
              setCache("cached -- offline ready", true);
              go();
            },
            false,
          );
          ac.addEventListener(
            "error",
            function () {
              setCache("cache unavailable");
              waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
            },
            false,
          );
          ac.addEventListener(
            "obsolete",
            function () {
              setCache("cache obsolete");
              waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
            },
            false,
          );
        }
      })();
    </script>
  </body>
</html>
